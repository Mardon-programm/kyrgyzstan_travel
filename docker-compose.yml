version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kyrgyzstan-travel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyrgyzstan_travel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kyrgyzstan_travel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kyrgyzstan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyrgyzstan-travel-backend
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      POSTGRES_DB: ${POSTGRES_DB:-kyrgyzstan_travel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kyrgyzstan-network
    restart: unless-stopped

  frontend:
    build:
      context: ./kyrgyzstan-travel
      dockerfile: Dockerfile
    container_name: kyrgyzstan-travel-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - kyrgyzstan-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kyrgyzstan-travel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/staticfiles:/var/www/static:ro
      - ./backend/media:/var/www/media:ro
      - ./kyrgyzstan-travel/dist:/var/www/frontend:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kyrgyzstan-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kyrgyzstan-network:
    driver: bridge